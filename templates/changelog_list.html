{% extends 'base.html' %}

{% block title %}Change History{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
        <h2>&#128337; Change History</h2>
        <p class="text-muted mb-0">Every management change, recorded with who did what and when (Vietnam time, UTC+7).</p>
    </div>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm">&larr; Back to Dashboard</a>
</div>

<div class="card esp-card">
    <div class="card-body">
        {% include '_changelog_entries.html' with entries=entries %}
    </div>
</div>
{% endblock %}
