{# Modal fragment: add/edit form body (no page chrome). Loaded via esp-modal.js. #}
<div class="esp-modal-head">
    <h3>{% if mode == 'add' %}&#10133; Add {{ label }}{% else %}&#9999; Edit {{ label }}{% endif %}</h3>
    <button type="button" class="esp-modal-x" data-esp-modal-close aria-label="Close">&#10005;</button>
</div>
{% if parent %}
    <p class="text-muted">Inside {{ parent_label }}: <strong>{{ parent }}</strong></p>
{% endif %}
<form method="post" enctype="multipart/form-data" novalidate data-esp-modal-form>
    {% csrf_token %}
    {% include '_form_fields.html' %}
    <div class="esp-modal-foot">
        <button type="submit" class="esp-btn esp-btn-primary">&#10003; {% if mode == 'add' %}Create {{ label }}{% else %}Save Changes{% endif %}</button>
        <button type="button" class="esp-btn esp-btn-ghost" data-esp-modal-close>Cancel</button>
    </div>
</form>
