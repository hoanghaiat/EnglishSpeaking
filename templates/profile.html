{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2>User Profile</h2>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Role:</strong> {{ user.role }}</p>
                {% if user.phone_number %}
                    <p><strong>Phone:</strong> {{ user.phone_number }}</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
