{% extends 'base.html' %}

{% block title %}Edit Lesson{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit Lesson</h2>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ lesson.title }}" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ lesson.description }}</textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">Update Lesson</button>
                <a href="{% url 'lesson_detail' lesson.id %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
