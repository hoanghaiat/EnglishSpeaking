{% load static %}
<style>
  #esp-modal { position: fixed; inset: 0; z-index: 2000; display: flex;
    align-items: center; justify-content: center; padding: 20px; }
  #esp-modal[hidden] { display: none; }
  .esp-modal-backdrop { position: absolute; inset: 0;
    background: rgba(15, 23, 42, .55); backdrop-filter: blur(2px); }
  .esp-modal-dialog { position: relative; background: #fff; border-radius: 18px;
    max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    animation: espModalIn .22s ease-out; }
  .esp-modal-content { padding: 24px; }
  .esp-modal-head { display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px; }
  .esp-modal-head h3 { margin: 0; font-size: 20px; }
  .esp-modal-x { border: none; background: #f1f5f9; border-radius: 50%;
    width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1; }
  .esp-modal-x:hover { background: #e2e8f0; }
  .esp-modal-foot { display: flex; gap: 10px; margin-top: 18px; }
  /* Self-contained form styling (works with or without Bootstrap) */
  #esp-modal .mb-3 { margin-bottom: 14px; }
  #esp-modal .form-label { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; display: block; }
  #esp-modal .form-control, #esp-modal .form-select {
    display: block; width: 100%; padding: 8px 12px; font-size: 14px; line-height: 1.5;
    color: #0f172a; background: #fff; border: 1px solid #cbd5e1; border-radius: 10px;
    margin-top: 4px; box-sizing: border-box; }
  #esp-modal textarea.form-control { min-height: 76px; resize: vertical; }
  #esp-modal .form-control:focus, #esp-modal .form-select:focus {
    outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
  #esp-modal .form-check { display: flex; align-items: center; gap: 8px; }
  #esp-modal .form-check-input { width: 16px; height: 16px; accent-color: #2563eb; }
  #esp-modal .form-text { font-size: 12.5px; color: #64748b; margin-top: 4px; }
  #esp-modal .text-danger { color: #dc2626; }
  #esp-modal .text-muted { color: #64748b; }
  #esp-modal .alert { border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
  #esp-modal .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  #esp-modal .alert-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  #esp-modal .alert ul { margin: 6px 0 0; padding-left: 18px; }
  #esp-modal .esp-btn { border: none; border-radius: 999px; padding: 9px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; }
  #esp-modal .esp-btn-primary { background: #2563eb; color: #fff; }
  #esp-modal .esp-btn-primary:hover { background: #1d4ed8; }
  #esp-modal .esp-btn-danger { background: #dc2626; color: #fff; }
  #esp-modal .esp-btn-danger:hover { background: #b91c1c; }
  #esp-modal .esp-btn-ghost { background: #f1f5f9; color: #334155; }
  #esp-modal .esp-btn-ghost:hover { background: #e2e8f0; }
  @keyframes espModalIn {
    from { transform: translateY(16px) scale(.98); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  body.esp-modal-open { overflow: hidden; }
</style>
<script src="{% static 'js/esp-modal.js' %}"></script>
