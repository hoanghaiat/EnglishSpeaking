{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto text-center">
        <h1 class="display-4">Welcome to English Speaking Practice</h1>
        <p class="lead">Improve your English speaking skills with structured lessons and practice.</p>
        
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="btn btn-primary btn-lg">Go to Dashboard</a>
        {% else %}
            <div class="mt-4">
                <a href="{% url 'login' %}" class="btn btn-success btn-lg me-2">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-outline-primary btn-lg">Sign Up</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
